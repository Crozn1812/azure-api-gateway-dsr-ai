name: Build and Deploy DSR API to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  RESOURCE_GROUP: rg-dsr-api-phase3
  ACR_NAME: acrdsrapi31862
  CONTAINER_APP_NAME: ca-dsr-api-phase3
  IMAGE_NAME: dsr-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Deploy image to Azure Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

      - name: Show deployed image
        run: |
          echo "Deployed image:"
          echo "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

      - name: Show Container App URL
        run: |
          az containerapp show \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv